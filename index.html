<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0f12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Tuner</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>
  <main class="app">
    <div class="title-band">
      <h1 class="app-title" id="appTitle"></h1>
    </div>
    <header class="top-bar">
      <select id="instrument" aria-label="Instrument">
        <option value="guitar">Guitar (Acoustic/Electric)</option>
        <option value="bass">Bass Guitar</option>
        <option value="ukulele">Ukulele</option>
        <option value="banjo">Banjo (5-string, Open G)</option>
        <option value="mandolin">Mandolin</option>
      </select>
    </header>

    <section class="display" aria-live="polite">
      <div class="note-row">
        <div class="note" id="note">—</div>
        <div class="octave" id="octave"></div>
      </div>
      <div class="target" id="target">Pick a string</div>
      <div class="readout">
        <span id="freq">0.0 Hz</span>
        <span class="sep">·</span>
        <span id="cents">0¢</span>
      </div>
    </section>

    <section class="meter" aria-label="Tuning meter">
      <div class="arrows left" id="leftArrows">
        <span>&gt;</span><span>&gt;</span><span>&gt;</span><span>&gt;</span>
      </div>
      <div class="center-dot" id="centerDot"></div>
      <div class="arrows right" id="rightArrows">
        <span>&lt;</span><span>&lt;</span><span>&lt;</span><span>&lt;</span>
      </div>
    </section>

    <section class="fine-meter" aria-label="Fine tuning meter">
      <div class="fine-zone"></div>
      <div class="fine-ticks">
        <span>-3¢</span><span>0</span><span>+3¢</span>
      </div>
      <div class="fine-needle" id="fineNeedle"></div>
    </section>

    <section class="strings" id="strings" aria-label="String targets"></section>

    <div class="bottom-band"></div>
    <footer class="controls">
      <button id="startBtn" class="primary">Start Tuner</button>
      <div class="status" id="status">Tap Start and allow microphone access</div>
    </footer>
  </main>

  <script src="tuner.js"></script>
</body>
</html>
